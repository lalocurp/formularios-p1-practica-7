<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Agrupamiento</title>
</head>
<body>

    <p><a href="index.html">&larr; Volver al Índice Principal</a></p>

    <!-- Formulario 10: Agrupamiento con fieldset y legend -->
    <h2>Formularios con Agrupamiento</h2>
    <form action="" method="post">
        <!-- 
            <fieldset> crea una caja contenedora para agrupar visual y lógicamente campos relacionados.
            <legend> establece un título superior descriptivo para cada grupo.
        -->
        <fieldset>
            <legend>Datos personales</legend>
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br><br>
            Documento válido:
            <input type="file" name="documento"><br><br>
            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
        </fieldset>

        <br>

        <fieldset>
            <legend>Datos de estudio:</legend>
            Nombre de la escuela:
            <input type="text" name="escuela"><br><br>
            Certificado válido:
            <input type="file" name="certificado"><br><br>
            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>

        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>

    <footer>
        <hr>
        <p><strong>Alumno:</strong> Jesus Candia Arenivas | <strong>Número de Control:</strong> 0814</p>
    </footer>

</body>
</html>
