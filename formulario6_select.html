<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Selección</title>
</head>
<body>

    <p><a href="index.html">&larr; Volver al Índice Principal</a></p>

    <!-- Formulario 6: Lista desplegable -->
    <h2>Formularios con Selección</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br><br>
        Selecciona tu país:
        <!-- 
            <select> crea un menú o lista desplegable de opciones. 
            Cada elemento individual dentro de la lista se define usando la etiqueta <option>.
        -->
        <select name="pais">
            <option value="1">Argentina</option>
            <option value="2">España</option>
            <option value="3">México</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="6">El Salvador</option>
            <option value="7">Venezuela</option>
            <option value="8">Colombia</option>
        </select>
        <br><br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>

    <footer>
        <hr>
        <p><strong>Alumno:</strong> Jesus Candia Arenivas | <strong>Número de Control:</strong> 0814</p>
    </footer>

</body>
</html>
