<html lang="es">

<body>

    <p><a href="index.html">&larr; Volver al Índice Principal</a></p>

    <!-- Formulario 7: Uso del elemento <button> -->
    <h2>Formulario con Botones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br><br>
        <!-- 
            La etiqueta <button> ofrece mayor flexibilidad para encapsular contenido como texto o imágenes.
            'type="submit"' envía los datos y 'type="reset"' reinicia los campos.
        -->
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
