    <!-- Formulario 9: Campos ocultos (hidden) -->
    <h2>Formulario con Campos Ocultos</h2>
    <form action="" method="post">
        <!-- 
            type="hidden" almacena datos que no se muestran en pantalla, 
            pero que se envían al servidor junto con el formulario (p. ej., marcas de tiempo o tokens).
        -->
        <input type="hidden" name="hora" value="3:30">

        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br><br>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
