<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Text Area</title>
</head>
<body>

    <p><a href="index.html">&larr; Volver al Índice Principal</a></p>

    <!-- Formulario 3: Uso de área de texto multilínea -->
    <h2>Formulario con Text Area</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br><br>
        <!-- Campo para correo electrónico con validación de sintaxis de email integrada -->
        Ingresa tu correo:
        <input type="email" name="correo">
        <br><br>
        <!-- 
            <textarea> permite ingresar bloques de texto de varias líneas.
            'rows' establece la altura en filas y 'cols' el ancho en columnas de texto.
        -->
        Ingresa tus comentarios:
        <br>
        <textarea name="comentarios" rows="4" cols="30"></textarea>
        <br><br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>

    <footer>
        <hr>
        <p><strong>Alumno:</strong> Jesus Candia Arenivas | <strong>Número de Control:</strong> 0814</p>
    </footer>

</body>
</html>
