<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Básico</title>
</head>
<body>

    <p><a href="index.html">&larr; Volver al Índice Principal</a></p>

    <!-- Formulario 1: Ejemplo básico de envío de texto -->
    <h2>Ejemplo Básico</h2>
    <!-- 
        El elemento <form> define el formulario. 
        'action' indica la ruta a donde se enviarán los datos y 'method' especifica el método HTTP (POST/GET).
    -->
    <form action="" method="post">
        <!-- Campo de entrada de texto simple con tamaño especificado de 20 caracteres -->
        Ingresa tu nombre:
        <input type="text" name="nombre" size="20">
        <br><br>
        <!-- Botón de tipo 'submit' para enviar la información recopilada -->
        <input type="submit" value="enviar">
    </form>

    <footer>
        <hr>
        <p><strong>Alumno:</strong> Jesus Candia Arenivas | <strong>Número de Control:</strong> 0814</p>
    </footer>

</body>
</html>
