    <!-- Formulario 2: Campos de texto y contraseña -->
    <h2>Formulario para Contraseñas</h2>
    <form action="" method="post">
        <!-- Campo para el usuario en texto plano -->
        Ingresa tu usuario:
        <input type="text" name="usuario">
        <br><br>
        <!-- Campo de contraseña donde los caracteres se ocultan por seguridad -->
        Ingresa tu contraseña:
        <input type="password" name="pass">
        <br><br>
        <!-- Botón para enviar datos -->
        <input type="submit" value="enviar">
        <!-- Botón de reinicio que limpia todos los campos del formulario -->
        <input type="reset" value="borrar">
    </form>
