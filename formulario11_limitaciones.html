<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Limitaciones</title>
</head>
<body>

    <p><a href="index.html">&larr; Volver al Índice Principal</a></p>

    <!-- Formulario 11: Atributos de restricción y limitación -->
    <h2>Formulario con Limitaciones</h2>
    <form action="" method="post">
        <!-- Atributo 'disabled': inhabilita completamente la interacción con el campo -->
        Ingresa tu nombre:
        <input type="text" name="nombre" disabled><br><br>

        <!-- Atributo 'maxlength': restringe el número máximo de caracteres permitidos -->
        Contraseña:
        <input type="password" name="pass" maxlength="5"><br><br>

        <!-- Atributo 'readonly': permite seleccionar o copiar el contenido, pero no editarlo -->
        Comentarios:
        <br>
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br><br>
    </form>

    <footer>
        <hr>
        <p><strong>Alumno:</strong> Jesus Candia Arenivas | <strong>Número de Control:</strong> 0814</p>
    </footer>

</body>
</html>
